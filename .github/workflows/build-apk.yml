# Build APK on every push to main, publish a Release, and mirror result to the build-status branch
# main push 시 APK 빌드 → Release 게시 → 결과(로그·APK)를 build-status 브랜치에도 기록
name: Build APK

on:
  push:
    branches: [main]      # Build on main push / main push 시 빌드
  workflow_dispatch:      # Manual run button / 수동 실행 버튼

permissions:
  contents: write         # Releases + status branch / 릴리스·상태 브랜치 쓰기 권한

jobs:
  build:
    runs-on: ubuntu-latest  # Android SDK preinstalled / 안드로이드 SDK 기본 설치
    steps:
      - uses: actions/checkout@v4                 # Get code / 코드 가져오기
      - uses: actions/setup-java@v4               # JDK 17 / 자바 17
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4      # Gradle 8.9 without wrapper jar / 래퍼 없이 그래들 설치
        with:
          gradle-version: '8.9'

      - name: Unit test + build / 단위테스트 + 빌드
        id: build
        continue-on-error: true                   # Record log even on failure / 실패해도 로그 기록
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log

      - name: Publish status branch / 상태 브랜치 기록
        if: always()
        run: |
          mkdir -p /tmp/status && cp build.log /tmp/status/ || true
          grep -E "^e: |error:|FAILED|What went wrong" -A3 build.log | head -200 > /tmp/status/errors.txt || true
          echo "${{ steps.build.outcome }} run=${{ github.run_number }} sha=${{ github.sha }}" > /tmp/status/RESULT
          cp app/build/outputs/apk/release/app-release.apk /tmp/status/TalkCoach.apk 2>/dev/null || true
          cd /tmp/status && git init -q -b build-status && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "build ${{ github.run_number }}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-status

      - name: Fail job if build failed / 빌드 실패 시 잡 실패 처리
        if: steps.build.outcome != 'success'
        run: exit 1

      - run: mv app/build/outputs/apk/release/app-release.apk TalkCoach.apk # Rename / 이름 변경
      - uses: softprops/action-gh-release@v2      # Publish release (download on phone) / 릴리스 게시 (폰에서 다운로드)
        with:
          tag_name: build-${{ github.run_number }}
          name: 톡코치 build ${{ github.run_number }}
          files: TalkCoach.apk
